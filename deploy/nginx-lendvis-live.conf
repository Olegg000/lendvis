# Роботы поисковиков и языковых моделей всегда получают русскую версию.
# Часть из них шлёт Accept-Language: en и уезжала бы на /en — а бренд русский,
# и в индексе с ним должна быть связана русская страница. Живых людей не касается.
map $http_user_agent $is_bot {
    default "";
    "~*(googlebot|yandex|bingbot|applebot|duckduckbot|baiduspider|slurp)" "bot";
    "~*(gptbot|oai-searchbot|chatgpt-user|claudebot|claude-searchbot|claude-user|perplexitybot|perplexity-user|bytespider|ccbot|amazonbot|meta-externalagent)" "bot";
}

# Итог: у робота пусто -> редиректа нет; у человека -> решение по печеньке и языку.
map $is_bot $lang_final {
    default   $lang_redirect;
    "bot"     "";
}

# Язык определяем ЗДЕСЬ, а не скриптом: Googlebot исполняет JS, и страница, уводящая
# себя на /en/, отправила бы туда и робота — он приходит с локалью en-US. Сервер же
# смотрит Accept-Language, а робот этот заголовок не присылает вовсе и всегда получает
# русскую версию. Редирект работает ТОЛЬКО на корне, внутренние адреса не трогает.
map $http_accept_language $lang_by_header {
    default "/en";
    ""      "";
    "~*(^|[,; ])ru"    "";
}

# Явный выбор человека сильнее языка браузера: печеньку ставит сам сайт.
map $cookie_lang $lang_redirect {
    default $lang_by_header;
    "ru"    "";
    "en"    "/en";
}

# Демо-приложения — витрина внутри карточек проектов, в поиске по бренду они лишние.
# Закрывать их в robots.txt нельзя: запрещённую страницу робот не скачает, а значит
# и запрета на индексацию в ней не прочитает — адрес всё равно может всплыть в выдаче.
# Поэтому пускаем робота и отвечаем ему заголовком. Пустое значение nginx не отправляет.
map $uri $robots_tag {
    default "";
    ~^/(quiz|drawer|alice|react-bugfix|blockchain-practice|python-faq-bot)(/|$) "noindex";
}

# Конфиг nginx для статического сайта Лендвис.
# HTTP-версия; сертификат и редирект на HTTPS добавляет certbot автоматически
# (см. provision.sh, шаг certbot). Меняешь домен — правь server_name.
server {
    server_name lendvis.ru;

    root /var/www/lendvis;
    index index.html;

    charset utf-8;

    add_header X-Robots-Tag $robots_tag always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;


    # Со слешем на конце адрес попадал в общий фоллбэк и отдавал главную с кодом 200.
    # Ссылки со слешем ставят по привычке, поэтому нормализуем в 301.
    location ~ ^(/en)?/(services|work|price|about|contact)/$ {
        return 301 https://$host$1/$2;
    }
    location = /en/ {
        return 301 https://$host/en;
    }

    # Корень: уводим на английскую версию только тех, у кого браузер просит не русский
    location = / {
        add_header Vary "Accept-Language, Cookie" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        if ($lang_final) {
            return 302 $lang_final;
        }
        try_files /index.html =404;
    }

    # Демо живут каталогами: без слеша адрес дублировал бы страницу под вторым URL.
    location ~ ^/(quiz|drawer|alice|react-bugfix|blockchain-practice|python-faq-bot)$ {
        return 301 https://$host/$1/;
    }

    # ── quiz (реальное приложение: клиент + API к Node/Postgres) ──
    location /quiz/api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
    }
    location /quiz/ {
        alias /var/www/quiz/;
        try_files $uri $uri/ /quiz/index.html;
    }

    # ── drawer (реальный realtime: статика + WebSocket) ──
    location /drawer/socket.io/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
    location /drawer/ {
        alias /var/www/drawer/;
        try_files $uri $uri/ /drawer/index.html;
    }

    location / {
        # Раньше последним звеном стоял /index.html, и ЛЮБОЙ несуществующий адрес
        # отдавал главную с кодом 200 — для поиска это «мягкий 404», страница-призрак.
        # Все шесть маршрутов лежат отдельными файлами, фоллбэк на приложение не нужен.
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lendvis.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lendvis.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.lendvis.ru) {
        return 301 https://lendvis.ru$request_uri;
    }


    if ($host = lendvis.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name lendvis.ru www.lendvis.ru;
    return 404; # managed by Certbot




}

# www отдавал ровно тот же сайт с кодом 200 — для поиска это два сайта-близнеца,
# и canonical лечит такое лишь наполовину. Теперь www только перенаправляет.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.lendvis.ru;

    ssl_certificate /etc/letsencrypt/live/lendvis.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lendvis.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://lendvis.ru$request_uri;
}
