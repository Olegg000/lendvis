# Конфиг nginx для статического сайта Лендвис.
# HTTP-версия; сертификат и редирект на HTTPS добавляет certbot автоматически
# (см. provision.sh, шаг certbot). Меняешь домен — правь server_name.
server {
    listen 80;
    listen [::]:80;
    server_name lendvis.ru www.lendvis.ru;

    root /var/www/lendvis;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA: любой неизвестный путь отдаём index.html — маршрутизация клиентская
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
