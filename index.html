<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Пути абсолютные: относительный ./favicon.svg на /en/services превращался
         в /en/favicon.svg и отдавал 404. И форматы, которые понимает поиск: Google
         показывает в выдаче BMP, GIF, ICO, PNG, JPEG, PPM и TIFF — SVG в списке нет,
         поэтому одной векторной иконки браузеру хватало, а поисковику нет. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Лендвис — студия разработки</title>
    <meta name="description" content="Лендвис — студия разработки под ключ: сайты, мобильные приложения, блокчейн, бекенды, поддержка, 1С." />
    <link rel="canonical" href="https://lendvis.ru/" />
    <meta name="theme-color" content="#050507" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Лендвис" />
    <meta property="og:url" content="https://lendvis.ru/" />
    <meta property="og:title" content="Лендвис — студия разработки" />
    <meta property="og:description" content="Сайты, мобильные приложения, блокчейн, бекенды. От архитектуры до боевого сервера." />
    <meta property="og:image" content="https://lendvis.ru/shots/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Onest:wght@200;300;400;500&family=Piazzolla:wght@800&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=PT+Serif:ital,wght@1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
    <!-- Структурированные данные: по ним поисковик понимает, что это организация,
         и показывает карточку бренда при запросе «Лендвис» вместо строки-ссылки -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Лендвис",
        "alternateName": "Lendvis",
        "url": "https://lendvis.ru/",
        "logo": "https://lendvis.ru/apple-touch-icon.png",
        "image": "https://lendvis.ru/shots/og.jpg",
        "description": "Студия разработки сложных IT-продуктов: веб-сервисы, мобильные приложения, боты, блокчейн и бекенды. Работаем удалённо с русско- и англоязычными заказчиками.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Самара",
          "addressCountry": "RU"
        },
        "areaServed": "Worldwide",
        "knowsLanguage": ["ru", "en"],
        "sameAs": ["https://github.com/lendvis", "https://t.me/lendvis"],
        "founder": {
          "@type": "Person",
          "name": "Ковалик Олег Владиславович",
          "alternateName": "Oleg Kovalik",
          "jobTitle": "Основатель студии",
          "sameAs": ["https://github.com/Olegg000"]
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "email": "hello@lendvis.ru",
          "url": "https://t.me/lendvis",
          "availableLanguage": ["ru", "en"]
        },
        "knowsAbout": [
          "Веб-разработка",
          "Мобильная разработка",
          "Блокчейн и смарт-контракты",
          "Бекенд и интеграции",
          "Телеграм-боты",
          "1С",
          "Поддержка и рефакторинг legacy-кода"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
